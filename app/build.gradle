plugins {
    alias(libs.plugins.android.application)
}

// FIX: Force the Kotlin metadata library to 0.9.0 to support Kotlin 2.1+ 
// and resolve the "Metadata version 2.1.0" compiler error.
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlinx' && details.requested.name == 'kotlinx-metadata-jvm') {
            details.useVersion '0.9.0'
        }
    }
}

android {
    namespace 'gr.hua.dit.moddrugmanager'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "gr.hua.dit.moddrugmanager"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.firebase.inappmessaging
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // Helps Room's compiler process newer Kotlin metadata
    annotationProcessor "org.jetbrains.kotlinx:kotlinx-metadata-jvm:0.9.0"

    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    implementation "androidx.lifecycle:lifecycle-livedata:2.9.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.work:work-runtime:2.9.0"
}
